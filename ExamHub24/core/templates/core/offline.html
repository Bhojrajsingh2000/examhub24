{% extends 'base.html' %}
{% block title %}You're Offline — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-wifi-off" style="font-size:4rem; color:#adb5bd;"></i>
    <h3 class="mt-3">You're offline</h3>
    <p class="text-muted">This page isn't available without an internet connection.<br>
    Mock tests, results, and live content need a connection to work correctly.</p>
    <button onclick="window.location.reload()" class="btn btn-primary mt-2">Try Again</button>
</div>
{% endblock %}
