{% extends 'base.html' %}
{% block content %}
<h3 class="mb-4">Exam Categories</h3>
<div class="row">
    {% for cat in categories %}
    <div class="col-md-3 col-sm-6 mb-3">
        <a href="{% url 'exams:exam_list' cat.slug %}" class="text-decoration-none">
            <div class="card h-100 text-center shadow-sm">
                <div class="card-body">
                    <i class="bi bi-mortarboard fs-1 text-primary"></i>
                    <h5 class="card-title mt-2">{{ cat.name }}</h5>
                    <p class="text-muted small">{{ cat.description|truncatewords:12 }}</p>
                </div>
            </div>
        </a>
    </div>
    {% empty %}
    <div class="text-center text-muted py-5 w-100">
        <i class="bi bi-mortarboard" style="font-size:2.5rem;"></i>
        <p class="mt-2 mb-0">No categories found. Add some from the admin panel.</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
