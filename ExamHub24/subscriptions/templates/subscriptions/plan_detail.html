{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h4>{{ plan.name }}</h4>
                <h2 class="text-primary">Rs. {{ plan.price }}</h2>
                <p class="text-muted">{{ plan.duration_days }} days validity</p>
                <ul>
                    {% for feature in plan.feature_list %}
                    <li>{{ feature }}</li>
                    {% endfor %}
                </ul>
                <form method="post" action="{% url 'payments:create_order' plan.id %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small">Have a coupon code?</label>
                        <input type="text" name="coupon_code" class="form-control text-uppercase" placeholder="e.g. WELCOME20">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Proceed to Pay</button>
                </form>

                {% if trial_eligible %}
                <form method="post" action="{% url 'subscriptions:start_trial' plan.id %}" class="mt-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-success w-100">
                        <i class="bi bi-gift"></i> Start {{ plan.trial_days }}-Day Free Trial Instead
                    </button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
