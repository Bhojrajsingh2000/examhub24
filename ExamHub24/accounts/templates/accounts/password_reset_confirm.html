{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h3 class="mb-3">Set a new password</h3>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Change Password</button>
        </form>
        {% else %}
        <p class="text-danger">This password reset link is invalid or has expired.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
