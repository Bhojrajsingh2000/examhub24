{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h3 class="mb-3">Verify your account</h3>
                <p class="text-muted">We've sent a 6-digit OTP to <strong>{{ email }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit" class="btn btn-primary w-100 mt-2">Verify</button>
                </form>
                <form method="post" action="{% url 'accounts:resend_otp' %}" class="mt-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-link btn-sm">Didn't get the OTP? Resend</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
