{% extends 'base.html' %}
{% block title %}Page Not Found — {{ SITE_NAME }}{% endblock %}
{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-primary">404</h1>
    <h4>Oops! This page doesn't exist.</h4>
    <p class="text-muted">The page you're looking for may have been moved or removed.</p>
    <a href="{% url 'core:home' %}" class="btn btn-primary mt-2">Back to Home</a>
</div>
{% endblock %}
