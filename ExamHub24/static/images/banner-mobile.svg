<svg width="700" height="420" viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="55%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="screenGradM" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <rect width="700" height="420" rx="20" fill="url(#bgGradM)"/>

  <!-- decorative blobs -->
  <circle cx="60" cy="60" r="90" fill="#ffffff" opacity="0.06"/>
  <circle cx="640" cy="380" r="110" fill="#fbbf24" opacity="0.10"/>
  <circle cx="620" cy="50" r="40" fill="#22c55e" opacity="0.12"/>

  <!-- Phone-style device mockup, centered -->
  <g transform="translate(210,50)">
    <rect x="0" y="0" width="280" height="330" rx="26" fill="#0f172a"/>
    <rect x="14" y="16" width="252" height="298" rx="12" fill="url(#screenGradM)"/>

    <!-- progress bar -->
    <rect x="30" y="34" width="220" height="9" rx="4.5" fill="#cbd5e1"/>
    <rect x="30" y="34" width="150" height="9" rx="4.5" fill="#2563eb"/>

    <!-- question block -->
    <rect x="30" y="58" width="220" height="12" rx="3" fill="#334155"/>
    <rect x="30" y="76" width="160" height="12" rx="3" fill="#334155"/>

    <!-- options -->
    <g>
      <rect x="30" y="106" width="220" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="49" cy="124" r="7" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
      <rect x="66" y="119" width="120" height="10" rx="4" fill="#94a3b8"/>
    </g>
    <g>
      <rect x="30" y="150" width="220" height="36" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2.2"/>
      <circle cx="49" cy="168" r="7" fill="#22c55e"/>
      <path d="M46 168 l2.4 2.4 l5 -5.6" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="66" y="163" width="100" height="10" rx="4" fill="#16a34a"/>
    </g>
    <g>
      <rect x="30" y="194" width="220" height="36" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <circle cx="49" cy="212" r="7" fill="none" stroke="#94a3b8" stroke-width="2.2"/>
      <rect x="66" y="207" width="140" height="10" rx="4" fill="#94a3b8"/>
    </g>

    <!-- bottom button -->
    <rect x="30" y="250" width="220" height="32" rx="8" fill="#2563eb"/>
  </g>

  <!-- floating score badge -->
  <g transform="translate(40,150)">
    <rect x="0" y="0" width="120" height="72" rx="14" fill="#ffffff"/>
    <circle cx="32" cy="36" r="20" fill="none" stroke="#22c55e" stroke-width="6"/>
    <path d="M23 36 l6.5 6.5 l13 -14.5" stroke="#22c55e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="62" y="22" width="46" height="8" rx="4" fill="#0f172a" opacity="0.7"/>
    <rect x="62" y="36" width="34" height="7" rx="3.5" fill="#94a3b8"/>
  </g>

  <!-- star badge -->
  <g transform="translate(500,320)">
    <circle cx="35" cy="35" r="35" fill="#ffffff"/>
    <path d="M35 16 l6 13 l14 2 l-10 10 l2.5 14 l-12.5 -7 l-12.5 7 l2.5 -14 l-10 -10 l14 -2 Z" fill="#fbbf24"/>
  </g>
</svg>
